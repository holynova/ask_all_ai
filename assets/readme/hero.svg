<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">Ask All AI — 一个问题，四家大模型同时回答</title>
  <desc id="desc">深色底标题：Ask All AI，一个问题同时发给 ChatGPT、Gemini、Grok、DeepSeek；右侧是一个提问条与四张模型回答卡并排流式呈现。</desc>

  <rect width="1200" height="360" rx="26" fill="#101820"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#93a3b5">LOCAL LLM COMPARATOR · 大模型并排对比</text>
    <text x="56" y="130" font-size="64" font-weight="700" fill="#e8eef4">Ask All AI</text>
    <text x="56" y="170" font-size="23" fill="#34c07a">一个问题，四家大模型同时回答</text>
    <text x="56" y="204" font-size="19" fill="#93a3b5">ChatGPT · Gemini · Grok · DeepSeek，并发提问，流式对比。</text>
    <g id="chips" font-size="18" fill="#e8eef4" text-anchor="middle">
      <g><rect x="56" y="238" width="126" height="36" rx="18" fill="#1a2433" stroke="#2a3648" stroke-width="1.5"/><text x="119" y="262">4 个模型</text></g>
      <g><rect x="194" y="238" width="144" height="36" rx="18" fill="#1a2433" stroke="#2a3648" stroke-width="1.5"/><text x="266" y="262">SSE 流式</text></g>
      <g><rect x="350" y="238" width="126" height="36" rx="18" fill="#1a2433" stroke="#2a3648" stroke-width="1.5"/><text x="413" y="262">多轮追问</text></g>
      <g><rect x="488" y="238" width="162" height="36" rx="18" fill="#1a2433" stroke="#2a3648" stroke-width="1.5"/><text x="569" y="262">零依赖服务端</text></g>
    </g>
  </g>

  <g id="compare-diagram" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <g id="question-bar">
      <rect x="740" y="52" width="420" height="46" rx="12" fill="#1a2433" stroke="#2a3648" stroke-width="1.5"/>
      <text x="760" y="81" font-size="18" fill="#93a3b5">写一个 Python 异步函数…</text>
      <rect x="1064" y="60" width="80" height="30" rx="8" fill="#34c07a"/>
      <text x="1104" y="80" font-size="18" font-weight="700" fill="#0b1410" text-anchor="middle">ASK</text>
    </g>
    <g id="model-cards">
      <g id="card-chatgpt">
        <rect x="740" y="120" width="96" height="150" rx="10" fill="#1a2433" stroke="#2a3648" stroke-width="1.5"/>
        <path d="M746 123 h84" stroke="#10a37f" stroke-width="6" stroke-linecap="round"/>
        <text x="788" y="150" font-size="18" fill="#e8eef4" text-anchor="middle">ChatGPT</text>
        <rect x="752" y="162" width="72" height="8" rx="4" fill="#2a3648"/>
        <rect x="752" y="178" width="60" height="8" rx="4" fill="#2a3648"/>
        <rect x="752" y="194" width="68" height="8" rx="4" fill="#2a3648"/>
        <rect x="752" y="210" width="44" height="8" rx="4" fill="#2a3648"/>
        <text x="752" y="252" font-size="18" fill="#34c07a">回答中</text>
      </g>
      <g id="card-gemini">
        <rect x="844" y="120" width="96" height="150" rx="10" fill="#1a2433" stroke="#2a3648" stroke-width="1.5"/>
        <path d="M850 123 h84" stroke="#4285f4" stroke-width="6" stroke-linecap="round"/>
        <text x="892" y="150" font-size="18" fill="#e8eef4" text-anchor="middle">Gemini</text>
        <rect x="856" y="162" width="72" height="8" rx="4" fill="#2a3648"/>
        <rect x="856" y="178" width="52" height="8" rx="4" fill="#2a3648"/>
        <rect x="856" y="194" width="66" height="8" rx="4" fill="#2a3648"/>
        <rect x="856" y="210" width="58" height="8" rx="4" fill="#2a3648"/>
        <text x="856" y="252" font-size="18" fill="#34c07a">回答中</text>
      </g>
      <g id="card-grok">
        <rect x="948" y="120" width="96" height="150" rx="10" fill="#1a2433" stroke="#2a3648" stroke-width="1.5"/>
        <path d="M954 123 h84" stroke="#e8eef4" stroke-width="6" stroke-linecap="round"/>
        <text x="996" y="150" font-size="18" fill="#e8eef4" text-anchor="middle">Grok</text>
        <rect x="960" y="162" width="72" height="8" rx="4" fill="#2a3648"/>
        <rect x="960" y="178" width="64" height="8" rx="4" fill="#2a3648"/>
        <rect x="960" y="194" width="48" height="8" rx="4" fill="#2a3648"/>
        <rect x="960" y="210" width="70" height="8" rx="4" fill="#2a3648"/>
        <text x="960" y="252" font-size="18" fill="#34c07a">回答中</text>
      </g>
      <g id="card-deepseek">
        <rect x="1052" y="120" width="96" height="150" rx="10" fill="#1a2433" stroke="#2a3648" stroke-width="1.5"/>
        <path d="M1058 123 h84" stroke="#4d6bfe" stroke-width="6" stroke-linecap="round"/>
        <text x="1100" y="150" font-size="18" fill="#e8eef4" text-anchor="middle">DeepSeek</text>
        <rect x="1064" y="162" width="72" height="8" rx="4" fill="#2a3648"/>
        <rect x="1064" y="178" width="58" height="8" rx="4" fill="#2a3648"/>
        <rect x="1064" y="194" width="70" height="8" rx="4" fill="#2a3648"/>
        <rect x="1064" y="210" width="40" height="8" rx="4" fill="#2a3648"/>
        <text x="1064" y="252" font-size="18" fill="#34c07a">回答中</text>
      </g>
    </g>
    <g id="diagram-note" text-anchor="middle">
      <text x="950" y="306" font-size="19" fill="#93a3b5">四路并行 · 各卡独立计时 · 随时取消</text>
    </g>
  </g>
</svg>
